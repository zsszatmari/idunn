[package]
name = "idunn"
version = "0.1.0"
edition = "2024"

[dependencies]
apple-signin = "0.2.0"
arc-swap = "1.9.2"
jsonwebtoken = "10.4.0"
# TODO: reqwest 0.12 is an old version, it's here because apple-signin depends on it
reqwest = "0.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "macros"] }
