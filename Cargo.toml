[package]
name = "idunn"
version = "0.1.0"
edition = "2024"

[dependencies]
arc-swap = "1.9.2"
async-lock = "3.4.2"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
reqwest = "0.13"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tracing = "0.1.35"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "macros"] }
