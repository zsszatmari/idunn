[package]
name = "idunn"
version = "0.1.0"
edition = "2024"

[dependencies]
arc-swap = "1.9.2"
async-lock = "3.4.2"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
reqwest = { version = "0.13", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tracing = "0.1.35"
url = "2.5.8"
zeroize = { version = "1.9", features = ["derive"] }

[dev-dependencies]
env_logger = "0.11"
# Self-dependency to force the "reqwest" feature on for `cargo test` (and anything
# built on top of it, e.g. `cargo llvm-cov`) even though it's off by default for
# plain `cargo build` — tests exercise ReqwestTransport directly.
idunn = { path = ".", features = ["reqwest"] }
# gzip feature needed for test coverage
reqwest = { version = "0.13", features = ["gzip"] }
tokio = { version = "1.53.1", features = ["rt", "macros"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage,coverage_nightly)'] }
