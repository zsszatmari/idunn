[package]
name = "idunn"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Sign in with Apple for Rust backends: verify identity tokens, exchange authorization codes and revoke refresh tokens."
repository = "https://github.com/zsszatmari/idunn"
keywords = ["apple", "sign-in-with-apple", "authentication", "jwt", "oauth"]
categories = ["authentication", "web-programming"]
include = ["/src", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[dependencies]
arc-swap = "1.9.2"
async-lock = "3.4.2"
jsonwebtoken = { version = "11", default-features = false, features = [
  "use_pem",
] }
reqwest = { version = "0.13", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
subtle = "2.6"
thiserror = "2.0.20"
tokio = { version = "1.53.1", optional = true, default-features = false, features = [
  "rt",
  "time",
] }
tracing = "0.1.35"
url = "2.5.8"
zeroize = { version = "1.9", features = ["derive"] }

[features]
# default is "aws_lc_rs" because rust_crypto falls under https://rustsec.org/advisories/RUSTSEC-2023-0071
default = ["aws_lc_rs"]
# Exactly one of these two must be enabled; a compile_error! in lib.rs enforces it.
aws_lc_rs = ["jsonwebtoken/aws_lc_rs"]
rust_crypto = ["jsonwebtoken/rust_crypto"]
# Exposes `test_fixtures` to downstream crates so their tests can build an
# AppleAuthClient without committing a second throwaway key. dev-dependencies only.
test-fixtures = []
# Background JWKS-refresh convenience: `AppleAuthClient::with_background_refresh`.
# Off by default — the runtime choice belongs to the binary. The
# runtime-agnostic `keystore_refresh_loop()` is available without this feature.
tokio-refresh = ["dep:tokio"]

[dev-dependencies]
env_logger = "0.11"
# Self-dependency to force the "reqwest" and "tokio-refresh" features on for
# `cargo test` (and anything built on top of it, e.g. `cargo llvm-cov`) even
# though both are off by default for plain `cargo build` — tests exercise
# ReqwestTransport and the tokio-gated code directly. `default-features = false`
# so this doesn't also force a crypto backend via "default".
idunn = { path = ".", default-features = false, features = [
  "reqwest",
  "tokio-refresh",
] }
# gzip feature needed for test coverage
reqwest = { version = "0.13", features = ["gzip"] }
tokio = { version = "1.53.1", features = ["rt", "macros", "time"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(coverage,coverage_nightly)',
] }

[package.metadata.docs.rs]
# docs.rs builds default features only, which would hide the reqwest and tokio-refresh
# API. all-features is impossible: aws_lc_rs and rust_crypto are mutually exclusive, and
# the default aws_lc_rs gives the same API. test-fixtures is for dev-dependencies only.
# Keep in sync with `just doc`.
features = ["reqwest", "tokio-refresh"]
